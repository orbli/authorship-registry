[package]
name = "authorship-registry-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web app + Lambda handler: report intake, review, public incident search."
default-run = "web"

[[bin]]
name = "web"
path = "src/main.rs"

[[bin]]
name = "lambda"
path = "src/bin/lambda.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
aws-config = { version = "1.13.0", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-dsql = { version = "1.78.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sesv2 = { version = "1.144.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1.132.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
axum = { version = "0.8", features = ["form", "query", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
bb8 = "0.9.1"
chrono = { version = "0.4.45", features = ["serde"] }
form_urlencoded = "1.2.2"
hex = "0.4.3"
lambda_http = "1.3.2"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "webpki-roots", "hostname"] }
askama = "0.16.1"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-uuid-1"] }
tokio-postgres-rustls = "0.14.0"
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1.26"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
webpki-roots = "1.0.11"

[dev-dependencies]
http-body-util = "0.1.5"
postgresql_embedded = { version = "0.22.0", default-features = false, features = ["theseus", "tls-rustls-aws-lc-rs", "tokio"] }
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"
