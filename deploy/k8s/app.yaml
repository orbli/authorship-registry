apiVersion: v1
kind: Service
metadata:
  name: registry
spec:
  selector: { app: registry }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
spec:
  replicas: 1
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
        - name: registry
          image: ghcr.io/orbli/authorship-registry:main
          ports: [{ containerPort: 3000 }]
          env:
            - { name: DB_DIALECT, value: postgres }
            - name: PG_PASSWORD
              valueFrom: { secretKeyRef: { name: registry-db, key: password } }
            - { name: DATABASE_URL, value: "postgres://registry:$(PG_PASSWORD)@postgres:5432/registry" }
            - { name: MAIL_DRIVER, value: console }   # demo: links are printed to the pod log
            - { name: BASE_URL, value: https://registry-lab.orbb.li }
            - name: ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: registry-app, key: ADMIN_EMAIL } }
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
